services:
  postgres:
    image: postgres:17
    container_name: flowai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: flowai
      POSTGRES_PASSWORD: flowai_dev
      POSTGRES_DB: flowai

    ports:
      - "5433:5432"

    volumes:
      - flowai_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: flowai-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - flowai_redis_data:/data

volumes:
  flowai_postgres_data:
  flowai_redis_data:
